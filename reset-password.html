<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set Password | Temp Cover</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
    margin: 0;
    padding: 30px 20px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
}

.container {
    max-width: 400px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #ff7a00;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #ff7a00;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.message {
    margin-top: 15px;
    text-align: center;
}

</style>

</head>


<body>


<div class="container">

<h1>
Create Password
</h1>


<p>
Set your password to access your Temp Cover customer portal.
</p>


<input 
type="password" 
id="password"
placeholder="Create password">


<button onclick="setPassword()">
Create Account
</button>


<div class="message" id="message"></div>


</div>



<script>

const supabaseClient = supabase.createClient(
    "https://lvjdaizpaqjnchjvrsni.supabase.co",
    "sb_publishable_fnag8tkEEClWTLVR7fL1sQ_3_rbAzEc"
);



async function setPassword(){


const password =
document.getElementById("password").value;



if(password.length < 6){

document.getElementById("message").innerText =
"Password must be at least 6 characters";

return;

}



const { error } =
await supabaseClient.auth.updateUser({

password: password

});



if(error){

document.getElementById("message").innerText =
error.message;

return;

}



document.getElementById("message").innerText =
"Password created. Redirecting...";



setTimeout(()=>{

window.location.href="login.html";

},2000);



}


</script>


</body>
</html>
