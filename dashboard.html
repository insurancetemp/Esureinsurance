<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Dashboard | Esureinsurance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
}

header{
background:#003b73;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:28px;
}

.logout{
background:#ffb000;
color:black;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h2{
color:#003b73;
margin-bottom:15px;
}

.card p{
margin:8px 0;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#003b73;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

@media(max-width:700px){

header{
flex-direction:column;
gap:15px;
}

}

</style>

</head>

<body>

<header>

<h1>Customer Dashboard</h1>

<button class="logout" onclick="logout()">

Logout

</button>

</header>

<div class="container">

<div class="grid">

<div class="card">

<h2>My Profile</h2>

<p><strong>Name:</strong> <span id="name">Loading...</span></p>

<p><strong>Email:</strong> <span id="email">Loading...</span></p>

<p><strong>Phone:</strong> <span id="phone">Loading...</span></p>

<p><strong>Address:</strong> <span id="address">Loading...</span></p>

</div>

<div class="card">

<h2>Quick Actions</h2>

<p><a href="quote.html">➕ Create New Quote</a></p>

<p><a href="index.html">🏠 Home Page</a></p>

<p><a href="#">📄 Download Policy</a></p>

</div>

</div>

<div class="card" style="margin-top:30px;">

<h2>My Quotes</h2>

<table>

<thead>

<tr>

<th>Reference</th>

<th>Vehicle</th>

<th>Cover</th>

<th>Price</th>

<th>Status</th>

</tr>

</thead>

<tbody id="quoteTable">

<tr>

<td colspan="5">

Loading quotes...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>
async function loadDashboard(){

const {data:{user}} = await supabaseClient.auth.getUser();

if(!user){

window.location.href="login.html";
return;

}

const {data:profile,error:profileError}=await supabaseClient

.from("profiles")

.select("*")

.eq("id",user.id)

.single();

if(profile){

document.getElementById("name").textContent=profile.full_name||"-";
document.getElementById("email").textContent=profile.email||"-";
document.getElementById("phone").textContent=profile.phone||"-";
document.getElementById("address").textContent=profile.address||"-";

}

const {data:quotes,error:quoteError}=await supabaseClient

.from("quotes")

.select("*")

.eq("user_id",user.id)

.order("created_at",{ascending:false});

const table=document.getElementById("quoteTable");

table.innerHTML="";

if(!quotes || quotes.length===0){

table.innerHTML=`
<tr>
<td colspan="5">
No quotes found.
</td>
</tr>
`;

}else{

quotes.forEach(q=>{

table.innerHTML+=`

<tr>

<td>${q.reference||"-"}</td>

<td>${q.registration||"-"}</td>

<td>${q.cover_type||"-"}</td>

<td>£${q.estimated_price||0}</td>

<td>${q.status||"Pending"}</td>

</tr>

`;

});

}

}

async function logout(){

await supabaseClient.auth.signOut();

window.location.href="login.html";

}

loadDashboard();
</script>
</body>
</html>
