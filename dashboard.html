<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempcover | My Insurance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{

background:#f5f7fb;
color:#1a1a1a;
padding-bottom:90px;

}


/* HEADER */

.header{

background:#ff8a00;
color:white;
padding:25px 20px 35px;
border-radius:0 0 30px 30px;

}

.logo{

font-size:28px;
font-weight:800;

}

.header p{

margin-top:8px;
opacity:.9;

}


/* PAGE */

.container{

max-width:500px;
margin:-15px auto 0;
padding:20px;

}



/* POLICY CARD */

.policy-card{

background:#dff1ff;
border-radius:25px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}


.policy-label{

font-size:13px;
font-weight:bold;
color:#0066aa;
text-transform:uppercase;

}


.vehicle{

font-size:30px;
font-weight:800;
margin-top:10px;

}


.vehicle-info{

color:#555;
margin-top:5px;

}



.cover{

margin-top:20px;
font-weight:700;
font-size:17px;

}



/* TIMER */


.timer-title{

margin-top:25px;
font-size:14px;
color:#555;

}


.timer{

display:flex;
gap:8px;
margin-top:10px;

}


.time-box{

background:white;
border-radius:15px;
padding:12px;
text-align:center;
flex:1;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}


.time-box strong{

display:block;
font-size:22px;
color:#003b73;

}


.time-box span{

font-size:11px;
color:#777;

}




/* BUTTON */


.policy-button{

display:block;
margin-top:25px;
background:#003b73;
color:white;
text-align:center;
padding:15px;
border-radius:15px;
text-decoration:none;
font-weight:bold;

}



/* NAVIGATION */


.nav{

position:fixed;
bottom:0;
left:0;
right:0;
height:75px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -5px 20px rgba(0,0,0,.1);

}


.nav a{

text-decoration:none;
color:#003b73;
font-size:12px;
text-align:center;

}


.nav strong{

display:block;
font-size:24px;

}



</style>

</head>


<body>


<div class="header">

<div class="logo">
Tempcover
</div>


<p>
Your insurance portal
</p>


</div>



<div class="container">


<div class="policy-card">


<div class="policy-label">
My Active Policy
</div>


<div class="vehicle" id="vehicleName">
Loading...
</div>


<div class="vehicle-info" id="vehicleInfo">
Loading...
</div>


<div class="cover" id="cover">
Fully Comprehensive
</div>


<div class="timer-title">
Time Remaining
</div>


<div class="timer">


<div class="time-box">
<strong id="days">00</strong>
<span>DAYS</span>
</div>


<div class="time-box">
<strong id="hours">00</strong>
<span>HOURS</span>
</div>


<div class="time-box">
<strong id="minutes">00</strong>
<span>MIN</span>
</div>


<div class="time-box">
<strong id="seconds">00</strong>
<span>SEC</span>
</div>


</div>



<a class="policy-button" href="policy.html">
View Policy Details
</a>



</div>


</div>

<script>

let timerInterval;


async function loadDashboard(){


const {data:{user}} = await supabaseClient.auth.getUser();


if(!user){

window.location.href="login.html";
return;

}




const {data:policy,error}=await supabaseClient

.from("policies")

.select("*")

.eq("user_id",user.id)

.order("created_at",{ascending:false})

.limit(1)

.single();




if(error || !policy){

document.getElementById("vehicleName").textContent =
"No active policy";

return;

}




document.getElementById("vehicleName").textContent =

(policy.make || "") + " " + (policy.model || "");



document.getElementById("vehicleInfo").textContent =

"Reg: " + (policy.registration || "-") +
" • " +
(policy.year || "-");




document.getElementById("cover").textContent =

policy.cover_type || "Fully Comprehensive";




startTimer(policy.end_date);



}




function startTimer(endDate){


if(timerInterval){

clearInterval(timerInterval);

}



function updateTimer(){


const now = new Date().getTime();

const end = new Date(endDate).getTime();


const distance = end - now;



if(distance <= 0){


document.getElementById("days").textContent="00";
document.getElementById("hours").textContent="00";
document.getElementById("minutes").textContent="00";
document.getElementById("seconds").textContent="00";


clearInterval(timerInterval);

return;

}




const days = Math.floor(

distance / (1000 * 60 * 60 * 24)

);



const hours = Math.floor(

(distance % (1000 * 60 * 60 * 24))

/ (1000 * 60 * 60)

);



const minutes = Math.floor(

(distance % (1000 * 60 * 60))

/ (1000 * 60)

);



const seconds = Math.floor(

(distance % (1000 * 60))

/ 1000

);



document.getElementById("days").textContent =
String(days).padStart(2,"0");


document.getElementById("hours").textContent =
String(hours).padStart(2,"0");


document.getElementById("minutes").textContent =
String(minutes).padStart(2,"0");


document.getElementById("seconds").textContent =
String(seconds).padStart(2,"0");



}



updateTimer();


timerInterval=setInterval(updateTimer,1000);


}






async function logout(){


await supabaseClient.auth.signOut();


window.location.href="login.html";


}


loadDashboard();


</script>




<div class="nav">


<a href="dashboard.html">

<strong>🏠</strong>

Home

</a>


<a href="profile.html">

<strong>👤</strong>

Profile

</a>


<a href="faq.html">

<strong>❓</strong>

FAQ

</a>


<a href="#" onclick="logout()">

<strong>🚪</strong>

Logout

</a>


</div>



</body>

</html>
