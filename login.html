<!DOCTYPE html>
<html>

<head>

<title>Customer Login - Esure Insurance</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
}

header {
    background:#003b73;
    color:white;
    padding:25px;
    text-align:center;
}

.container {
    padding:20px;
}

.card {
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    width:100%;
    padding:15px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

a {
    text-decoration:none;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</head>


<body>

<header>

<h1>Esure Insurance</h1>
<p>Customer Portal</p>

</header>


<div class="container">

<div class="card">

<h2>Login</h2>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">


<a href="dashboard.html">
<button onclick="loginUser()">
Login
</button>
</a>
<p style="text-align:center;">
New customer?
</p>
<a href="signup.html">
<button>
Create Account
</button>
</a>


<script>

async function loginUser(){

const email = document.querySelector('input[type="email"]').value;
const password = document.querySelector('input[type="password"]').value;

const { data, error } = await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if(error){
alert(error.message);
}else{
window.location.href = "dashboard.html";
}

}

</script>

</body>

<a href="quote.html">
<button>
Start a Quote

</a>

</html>
