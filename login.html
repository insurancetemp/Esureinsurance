<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Esureinsurance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{

width:95%;
max-width:450px;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

}

h2{

text-align:center;

color:#003b73;

margin-bottom:30px;

}

input{

width:100%;

padding:14px;

margin-bottom:20px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

}

input:focus{

outline:none;

border:2px solid #003b73;

}

button{

width:100%;

padding:16px;

background:#003b73;

color:white;

border:none;

border-radius:8px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#00519d;

}

#message{

margin-top:20px;

text-align:center;

font-weight:bold;

}

a{

display:block;

text-align:center;

margin-top:20px;

text-decoration:none;

font-weight:bold;

color:#003b73;

}

</style>

</head>

<body>

<div class="container">

<h2>Customer Login</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

<div id="message"></div>

</form>

<a href="signup.html">

Create an Account

</a>

</div>

<script>

const form=document.getElementById("loginForm");
const message=document.getElementById("message");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

message.innerHTML="";

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

try{

const {error}=await supabaseClient.auth.signInWithPassword({

email,
password

});

if(error) throw error;

message.style.color="green";
message.innerHTML="Login successful...";

setTimeout(()=>{

window.location.href="dashboard.html";

},1000);

}catch(err){

message.style.color="red";
message.innerHTML=err.message;

}

});

</script>

</body>

</html>
