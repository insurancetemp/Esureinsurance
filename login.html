<!DOCTYPE html>
<html>

<head>

<title>Customer Login - Esure Insurance</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {

    background:#f5f7fa;

}

header {

    padding:25px;
    text-align:center;
}

.container {
    padding:20px;
}

.card {

}

input {
    width:100%;
    padding:12px;
    margin:10px 0;

    border:1px solid #ccc;

button {
    width:100%;
    padding:15px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

a {
    text-decoration:none;
}

</head>


<body>

<header>

<h1>Esure Insurance</h1>
<p>Customer Portal</p>

</header>


<div class="container">

<div class="card">

<h2>Login</h2>

<input type="email" placeholder="Email Address">

<input type="password" placeholder="Password">


<a href="dashboard.html">
<button>
Login
</button>
</a>
<p style="text-align:center;">
New customer?
</p>


<a href="quote.html">
<button>
Start a Quote
</button>
</a>


</div>

</div>

</html>
