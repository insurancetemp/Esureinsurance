<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Your Account | Temp Cover</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:430px;
background:#fff;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
overflow:hidden;
}

.header{
background:#f58220;
color:#fff;
padding:35px 25px;
text-align:center;
}

.header h1{
font-size:32px;
margin-bottom:8px;
font-weight:700;
}

.header p{
font-size:15px;
opacity:.95;
line-height:1.5;
}

.content{
padding:30px 25px;
}

h2{
font-size:24px;
margin-bottom:10px;
color:#222;
}

.subtitle{
font-size:15px;
color:#666;
margin-bottom:25px;
line-height:1.6;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#333;
}

input{
width:100%;
padding:14px;
border:1px solid #d8d8d8;
border-radius:10px;
margin-bottom:18px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#f58220;
}

button{
width:100%;
padding:15px;
background:#f58220;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#e46d08;
}

.message{
margin-top:18px;
text-align:center;
font-size:14px;
}

.footer{
margin-top:30px;
text-align:center;
font-size:14px;
color:#666;
}

.footer a{
color:#f58220;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Temp Cover</h1>

<p>Your policy is active.<br>Create your online account to access your documents.</p>

</div>

<div class="content">
<h2>Create Your Account</h2>

<p class="subtitle">
Create a password to access your Temp Cover customer portal.
</p>

<form id="signupForm">

<label>Email Address</label>
<input
type="email"
id="email"
placeholder="Enter your email address"
required>

<label>Create Password</label>
<input
type="password"
id="password"
placeholder="Create a secure password"
required>

<label>Confirm Password</label>
<input
type="password"
id="confirmPassword"
placeholder="Confirm your password"
required>

<button type="submit">
Create My Account
</button>

<div class="message" id="message"></div>

</form>

<div class="footer">
Already have an account?
<a href="login.html">Sign In</a>
</div>

</div>

</div>
<script>

document
.getElementById("signupForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const message =
document.getElementById("message");

message.style.color = "red";

if(password !== confirmPassword){

message.textContent =
"Passwords do not match.";

return;

}

if(password.length < 8){

message.textContent =
"Password must be at least 8 characters.";

return;

}

message.style.color = "#333";
message.textContent = "Creating your account...";

const { error } =
await supabaseClient.auth.signUp({

email: email,
password: password

});

if(error){

message.style.color = "red";
message.textContent = error.message;
return;

}

message.style.color = "green";

message.textContent =
"Account created successfully. Please check your email to verify your account.";

setTimeout(function(){

window.location.href = "login.html";

},3000);

});

</script>

</body>

</html>
