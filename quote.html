<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get Your Quote | Esureinsurance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
}

header{
background:#003b73;
padding:20px;
color:white;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:950px;
margin:40px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,.12);
}

h2{
color:#003b73;
margin-bottom:25px;
text-align:center;
}

.section{
margin-bottom:35px;
}

.section h3{
color:#003b73;
margin-bottom:15px;
border-bottom:2px solid #003b73;
padding-bottom:8px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:18px;
}

.full{
margin-bottom:18px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

input:focus,
select:focus{
outline:none;
border:2px solid #003b73;
}

.quoteBox{
background:#f5f8fc;
border:2px solid #003b73;
padding:25px;
border-radius:10px;
text-align:center;
margin-top:30px;
}

.quotePrice{
font-size:42px;
font-weight:bold;
color:#003b73;
margin:15px 0;
}

button{
width:100%;
padding:18px;
background:#ffb000;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#ffca42;
}

.success{
color:green;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.error{
color:red;
font-weight:bold;
margin-top:20px;
text-align:center;
}

@media(max-width:700px){

.row{
grid-template-columns:1fr;
}

.container{
margin:20px;
padding:20px;
}

}

</style>

</head>

<body>

<header>

Esureinsurance Quote Application

</header>

<div class="container">

<h2>Temporary Motor Insurance Quote</h2>

<form id="quoteForm">

<div class="section">

<h3>Personal Details</h3>

<div class="row">

<div>

<label>First Name</label>

<input
type="text"
id="firstName"
required>

</div>

<div>

<label>Last Name</label>

<input
type="text"
id="lastName"
required>

</div>

</div>

<div class="row">

<div>

<label>Date of Birth</label>

<input
type="date"
id="dob"
required>

</div>

<div>

<label>Email Address</label>

<input
type="email"
id="email"
required>

</div>

</div>

<div class="row">

<div>

<label>Mobile Number</label>

<input
type="tel"
id="phone"
required>

</div>

<div>

<label>Occupation</label>

<input
type="text"
id="occupation"
required>

</div>

</div>

<div class="full">

<label>Home Address</label>

<input
type="text"
id="address"
required>

</div>

<div class="full">

<label>Driving Licence Number</label>

<input
type="text"
id="licence"
required>

</div>

</div>
<div class="section">

<h3>Vehicle Details</h3>

<div class="row">

<div>

<label>Vehicle Registration</label>

<input
type="text"
id="registration"
placeholder="AB12CDE"
style="text-transform:uppercase;"
required>

</div>

<div>

<label>Vehicle Make</label>

<input
type="text"
id="make"
placeholder="Ford"
required>

</div>

</div>

<div class="row">

<div>

<label>Vehicle Model</label>

<input
type="text"
id="model"
placeholder="Focus"
required>

</div>

<div>

<label>Vehicle Year</label>

<input
type="number"
id="year"
min="1980"
max="2026"
required>

</div>

</div>

<div class="row">

<div>

<label>Cover Type</label>

<select id="cover">

<option value="">Select Cover</option>

<option value="1hour">1 Hour</option>

<option value="2hours">2 Hours</option>

<option value="6hours">6 Hours</option>

<option value="12hours">12 Hours</option>

<option value="1day">1 Day</option>

<option value="7days">7 Days</option>

<option value="30days">30 Days</option>

</select>

</div>

<div>

<label>Vehicle Value (£)</label>

<input
type="number"
id="value"
placeholder="5000">

</div>

</div>

</div>

<div class="quoteBox">

<h3>Your Estimated Quote</h3>

<div class="quotePrice" id="price">

£0

</div>

<p>
The price will update automatically when you choose your cover.
</p>

</div>

<button type="submit">

Generate My Quote

</button>

<div id="message"></div>

</form>

</div>

<script>

const cover=document.getElementById("cover");
const price=document.getElementById("price");

cover.addEventListener("change",()=>{

let amount=0;

switch(cover.value){

case "1hour":
amount=20;
break;

case "2hours":
amount=35;
break;

case "6hours":
amount=55;
break;

case "12hours":
amount=70;
break;

case "1day":
amount=45;
break;

case "7days":
amount=180;
break;

case "30days":
amount=450;
break;

}

price.innerHTML="£"+amount;

});
document.getElementById("quoteForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const message=document.getElementById("message");

message.innerHTML="";

const { data:{ user } } = await supabaseClient.auth.getUser();


const quoteRef="ES-"+Math.floor(Math.random()*900000+100000);

const quotePrice=parseFloat(price.innerHTML.replace("£",""))||0;

try{

const {error}=await supabaseClient
.from("quotes")
.insert([{

user_id:null,

reference:quoteRef,

first_name:document.getElementById("firstName").value,

last_name:document.getElementById("lastName").value,

date_of_birth:document.getElementById("dob").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

occupation:document.getElementById("occupation").value,

address:document.getElementById("address").value,

driving_licence:document.getElementById("licence").value,

registration:document.getElementById("registration").value.toUpperCase(),

make:document.getElementById("make").value,

model:document.getElementById("model").value,

year:document.getElementById("year").value,

vehicle_value:document.getElementById("value").value,

cover_type:document.getElementById("cover").value,

estimated_price:quotePrice,

status:"Pending"

}]);

if(error) throw error;

message.className="success";

message.innerHTML=
"Quote created successfully.<br><br>Reference: <b>"+quoteRef+"</b><br><br>Your estimated price is <b>£"+quotePrice+"</b>";

document.getElementById("quoteForm").reset();

price.innerHTML="£0";

}
catch(err){

message.className="error";

message.innerHTML=err.message;

}

});

</script>
<script>
const supabaseClient = supabase.createClient(
  "https://lvjdaizpaqjnchjvrsni.supabase.co",
  "sb_publishable_fnag8tkEEClWTLVR7fL1sQ_3_rbAzEc"
);

document.getElementById("quoteForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    const email = document.getElementById("email").value;
    const address = document.getElementById("address").value;
    const occupation = document.getElementById("occupation").value;
    const licence = document.getElementById("licence").value;
    const registration = document.getElementById("registration").value;

    const fullName = firstName + " " + lastName;

    // Example temporary quote price
    const price = 45;

    const { data, error } = await supabaseClient
    .from("quotes")
    .insert([
        {
            full_name: fullName,
            email: email,
            registration: registration,
            estimated_price: price,
            status: "pending"
        }
    ]);

    if(error){
        alert("Error saving quote: " + error.message);
        console.log(error);
    } else {
        alert("Quote submitted successfully! Price: £" + price);
        console.log(data);
    }
});
</script>
</body>

</html>
