<!DOCTYPE html>
<html>

<head>

<title>Get a Quote - Esure Insurance</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

body {
font-family: Arial, sans-serif;
background:#f5f7fa;
margin:0;
}

header {
background:#003b73;
color:white;
padding:20px;
text-align:center;
}

.container {
padding:20px;
}

form {
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px #ccc;
}

input, select {
width:100%;
padding:12px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button {
width:100%;
padding:15px;
background:#0066cc;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

</style>

</head>


<body>


<header>

<h1>Esure Insurance</h1>
<p>Get Your Quote</p>

</header>


<div class="container">


<form>


<h2>Your Details</h2>


<input id="firstName" type="text" placeholder="First Name">

<input id="lastName" type="text" placeholder="Last Name">

<input id="email" type="email" placeholder="Email Address">

<input id="phone" type="tel" placeholder="Phone Number">

<input id="dob" type="date">

<input id="address" type="text" placeholder="Address">


<h2>Vehicle Details</h2>


<input id="registration" type="text" placeholder="Vehicle Registration">

<input id="make" type="text" placeholder="Vehicle Make">

<input id="model" type="text" placeholder="Vehicle Model">

<input id="year" type="number" placeholder="Vehicle Year">


<h2>Choose Your Cover</h2>


<select id="coverType" onchange="calculatePrice()">

<option value="daily">
Daily Cover - £45 (24 Hours)
</option>

<option value="hourly">
Hourly Cover - £20 per hour
</option>

</select>


<input id="hours" type="number" placeholder="Number of hours" onchange="calculatePrice()">



<h3>
Your Quote: £<span id="price">45</span>
</h3>



<button type="button" onclick="submitQuote()">

Get Quote

</button>


</form>


</div>



<script>


function calculatePrice(){


let cover = document.getElementById("coverType").value;


let price = 45;


if(cover === "hourly"){


let hours = document.getElementById("hours").value;


if(hours){

price = hours * 20;

}else{

price = 20;

}


}


document.getElementById("price").innerHTML = price;


}



async function submitQuote(){


try{


alert("Creating your account...");


const email = document.getElementById("email").value;



const { data: authData, error: authError } = await supabaseClient.auth.signUp({

email: email,

password: "TempPassword123!"

});


if(authError){

alert(authError.message);
return;

}



const userId = authData.user.id;



await supabaseClient
.from("profiles")
.insert({

id:userId,

first_name:document.getElementById("firstName").value,

last_name:document.getElementById("lastName").value,

email:email,

phone:document.getElementById("phone").value,

address:document.getElementById("address").value,

date_of_birth:document.getElementById("dob").value

});



await supabaseClient
.from("vehicles")
.insert({

user_id:userId,

registration:document.getElementById("registration").value,

make:document.getElementById("make").value,

model:document.getElementById("model").value,

year:document.getElementById("year").value

});



await supabaseClient
.from("quotes")
.insert({

user_id:userId,

cover_type:document.getElementById("coverType").value,

estimated_price:document.getElementById("price").innerText,

status:"approved"

});



alert("Quote created successfully. Check your email.");



}



catch(error){


alert(error.message);


}



}


</script>


</body>

</html>
