<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get a Quote - Esureinsurance</title>

<style>

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f7fa;
}

header {
    background:#003b73;
    color:white;
    text-align:center;
    padding:25px;
}

.container {
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.card {
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2 {
    color:#003b73;
}

label {
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input, select {
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button {
    margin-top:20px;
    padding:14px;
    width:100%;
    background:#ffb000;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.lookup {
    display:flex;
    gap:10px;
}

.lookup input {
    flex:1;
}

.lookup button {
    width:160px;
    margin-top:5px;
}

.vehicle-box {
    background:#eef6ff;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}


@media(max-width:600px){

.lookup {
    display:block;
}

.lookup button {
    width:100%;
}

}

</style>

</head>


<body>


<header>

<h1>Esureinsurance</h1>

<p>Get your temporary insurance quote</p>

</header>



<div class="container">


<div class="card">


<h2>Your Details</h2>


<label>
Full Name
</label>

<input type="text" placeholder="Enter your name">


<label>
Email Address
</label>

<input type="email" placeholder="Enter your email">


<label>
Phone Number
</label>

<input type="tel" placeholder="Enter phone number">



<h2>Vehicle Details</h2>


<label>
Registration Number
</label>


<div class="lookup">

<input id="registration" placeholder="Example AB12 CDE">


<button onclick="findVehicle()">
Find Vehicle
</button>

</div>



<div class="vehicle-box">


<label>
Make
</label>

<input id="make" placeholder="Vehicle make">


<label>
Model
</label>

<input id="model" placeholder="Vehicle model">


<label>
Year
</label>

<input id="year" placeholder="Vehicle year">


<label>
Engine Size
</label>

<input id="engine" placeholder="Example 1998cc">


<label>
Fuel Type
</label>

<input id="fuel" placeholder="Petrol / Diesel / Electric">


</div>



<button onclick="continueQuote()">
Continue
</button>



</div>


</div>




<script>


function findVehicle(){

let reg = document.getElementById("registration").value;


if(reg === ""){

alert("Please enter your registration number");

return;

}


// API connection will be added here

alert("Vehicle lookup ready - API will be connected next");


}



function continueQuote(){

alert("Quote form ready");

}


</script>



</body>

</html>
