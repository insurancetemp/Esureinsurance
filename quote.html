<!DOCTYPE html>
<html>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>    
<head>

<title>Get a Quote - Esure Insurance</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
}

header {
    background:#003b73;
    color:white;
    padding:20px;
    text-align:center;
}

.container {
    padding:20px;
}

form {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

input, select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    width:100%;
    padding:15px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

</style>

</head>


<body>

<header>
<h1>Esure Insurance</h1>
<p>Get Your Quote</p>
</header>


<div class="container">

<form>

<h2>Your Details</h2>

<input id="FirstName" type="text" placeholder="First Name">

<input id="lastName" type="text" placeholder="Last Name">

<input id= "email"type="email" placeholder="Email Address">

<input id="phone" type="tel" placeholder="Phone Number">

<input id="date of Birth" type="date" placeholder="Date of Birth">

<input id="Address" type="text" placeholder="Address">


<h2>Vehicle Details</h2>

<input type="text" placeholder="Vehicle Registration">

<input id="make" type="text" placeholder="Vehicle Make">

<input id="Model" type="text" placeholder="Vehicle Model">

<input id="year" type="number" placeholder="Vehicle Year">


<h2>Choose Your Cover</h2>

<select id="coverType" onchange="calculatePrice()">

<option value="daily">Daily Cover - £30 (24 Hours)</option>

<option value="hourly">Hourly Cover - £25 per hour</option>

</select>


<div id="hoursBox">

<input id="hours" type="number" placeholder="Number of hours" onchange="calculatePrice()">

</div>


<h3>
Your Quote:
£<span id="price">£30/span>
</h3>


<button type="button" onclick="submitQuote()">
Get Quote
</button>


</form>

</div>

<script>

function calculatePrice(){

let cover = document.getElementById("coverType").value;

let price = 30;


if(cover === "hourly"){

let hours = document.getElementById("hours").value;

if(hours){

price = hours * 25;

}else{

price = 25;

}

}


document.getElementById("price").innerHTML = price;


}


</script>
<script>

async function submitQuote(){

const firstName = document.getElementById("firstName").value;
const lastName = document.getElementById("lastName").value;
const email = document.getElementById("email").value;
const phone = document.getElementById("phone").value;
const dob = document.getElementById("dob").value;
const address = document.getElementById("address").value;

const registration = document.getElementById("registration").value;
const make = document.getElementById("make").value;
const model = document.getElementById("model").value;
const year = document.getElementById("year").value;

const coverType = document.getElementById("coverType").value;
const price = document.getElementById("price").innerText;


// Create account

const { const { data: authData, error: authError } = await supabaseClient.auth.signUp({

email: email,

password: "TempPassword123!"

});

};


if(authError){

alert(authError.message);
return;

}


const userId = authData.user.id;


// Save customer profile

await supabaseClient
.from("profiles")
.insert({

id: userId,
first_name: firstName,
last_name: lastName,
email: email,
phone: phone,
address: address,
date_of_birth: dob

});


// Save vehicle

await supabaseClient
.from("vehicles")
.insert({

user_id: userId,
registration: registration,
make: make,
model: model,
year: year

});


// Save quote

await supabaseClient
.from("quotes")
.insert({

user_id: userId,
cover_type: coverType,
estimated_price: price,
status: "approved"

});


alert("Your quote has been created. Please check your email to confirm your account and access your portal.");

}


</script>

</body>
</html>
