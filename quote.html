<!DOCTYPE html>
<html>
<head>

<title>Get a Quote - Esure Insurance</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
}

header {
    background:#003b73;
    color:white;
    padding:20px;
    text-align:center;
}

.container {
    padding:20px;
}

form {
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px #ccc;
}

input, select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:6px;
    border:1px solid #ccc;
}

button {
    width:100%;
    padding:15px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
}

</style>

</head>


<body>

<header>
<h1>Esure Insurance</h1>
<p>Get Your Quote</p>
</header>


<div class="container">

<form>

<h2>Your Details</h2>

<input type="text" placeholder="First Name">

<input type="text" placeholder="Last Name">

<input type="email" placeholder="Email Address">

<input type="tel" placeholder="Phone Number">

<input type="date" placeholder="Date of Birth">

<input type="text" placeholder="Address">


<h2>Vehicle Details</h2>

<input type="text" placeholder="Vehicle Registration">

<input type="text" placeholder="Vehicle Make">

<input type="text" placeholder="Vehicle Model">

<input type="number" placeholder="Vehicle Year">


<h2>Cover Required</h2>

<select>

<option>Temporary Insurance</option>

<option>Daily Cover</option>

<option>Monthly Cover</option>

</select>


<button type="button">
Get Quote
</button>


</form>

</div>


</body>
</html>
