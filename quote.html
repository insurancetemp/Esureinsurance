<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get Your Quote | Esure Insurance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#eef3f8;
}

header{
background:#003b73;
color:white;
padding:20px;
text-align:center;
}

header h1{
font-size:32px;
margin-bottom:5px;
}

.container{
max-width:950px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,.12);
}

h2{
color:#003b73;
margin-bottom:25px;
text-align:center;
}

.section{
margin-bottom:35px;
}

.section h3{
color:#003b73;
border-bottom:2px solid #003b73;
padding-bottom:8px;
margin-bottom:20px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.full{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

input:focus,
select:focus{
outline:none;
border:2px solid #003b73;
}

.quoteBox{
background:#f5f8fc;
border:2px solid #003b73;
padding:25px;
border-radius:10px;
text-align:center;
margin-top:30px;
}

.quotePrice{
font-size:42px;
font-weight:bold;
color:#003b73;
margin:15px 0;
}

button{
width:100%;
padding:18px;
background:#ffb000;
border:none;
border-radius:10px;
font-size:20px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#ffca42;
}

.success{
color:green;
font-weight:bold;
margin-top:20px;
text-align:center;
}

.error{
color:red;
font-weight:bold;
margin-top:20px;
text-align:center;
}

@media(max-width:700px){

.row{
grid-template-columns:1fr;
}

.container{
margin:20px;
padding:20px;
}

}

</style>

</head>

<body>

<header>

<h1>Esure Insurance</h1>

<p>Temporary Motor Insurance</p>

</header>

<div class="container">

<h2>Get Your Quote</h2>

<form id="quoteForm">

<div class="section">

<h3>Personal Details</h3>

<div class="row">

<div>
<label>First Name</label>
<input type="text" id="firstName" required>
</div>

<div>
<label>Last Name</label>
<input type="text" id="lastName" required>
</div>

</div>

<div class="row">

<div>
<label>Date of Birth</label>
<input type="date" id="dob" required>
</div>

<div>
<label>Email Address</label>
<input type="email" id="email" required>
</div>

</div>

<div class="row">

<div>
<label>Mobile Number</label>
<input type="tel" id="phone" required>
</div>

<div>
<label>Occupation</label>
<input type="text" id="occupation" required>
</div>

</div>

<div class="full">

<label>Home Address</label>
<input type="text" id="address" required>

</div>

<div class="full">

<label>Driving Licence Number</label>
<input type="text" id="licence" required>

</div>

</div>

<div class="section">

<h3>Vehicle Details</h3>

<div class="row">

<div>
<label>Vehicle Registration</label>
<input
type="text"
id="registration"
placeholder="AB12CDE"
style="text-transform:uppercase;"
required>
</div>

<div>
<label>Vehicle Make</label>
<input type="text" id="make" required>
</div>

</div>

<div class="row">

<div>
<label>Vehicle Model</label>
<input type="text" id="model" required>
</div>

<div>
<label>Vehicle Year</label>
<input
type="number"
id="year"
min="1980"
max="2026"
required>
</div>

</div>

<div class="row">

<div>

<label>Cover Type</label>

<select id="cover" required>

<option value="">Select Cover</option>
<option value="1hour">1 Hour (£20)</option>
<option value="2hours">2 Hours (£40)</option>
<option value="6hours">6 Hours (£120)</option>
<option value="12hours">12 Hours (£240)</option>
<option value="1day">1 Day (£45)</option>

</select>

</div>

<div>

<label>Vehicle Value (£)</label>

<input
type="number"
id="value"
placeholder="5000">

</div>

</div>

</div>

<div class="quoteBox">

<h3>Your Quote</h3>

<div class="quotePrice" id="price">

£0

</div>

<p>
Select your cover to calculate your quote.
</p>

</div>

<button type="submit">

Generate My Quote

</button>

<div id="message"></div>
</form>
<script>

const coverSelect = document.getElementById("cover");
const priceBox = document.getElementById("price");

const prices = {
    "1hour":20,
    "2hours":40,
    "6hours":120,
    "12hours":240,
    "1day":45
};

coverSelect.addEventListener("change",function(){

    const price = prices[this.value] || 0;
    priceBox.innerText = "£" + price;

});

document.getElementById("quoteForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const message = document.getElementById("message");
    message.innerHTML = "Creating your quote...";

    const quotePrice = prices[coverSelect.value] || 0;

    if(quotePrice === 0){
        message.innerHTML = "Please select a cover option.";
        return;
    }

    const quoteRef = "ES" + Math.floor(Math.random()*900000+100000);

    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const occupation = document.getElementById("occupation").value;
    const dob = document.getElementById("dob").value;
    const address = document.getElementById("address").value;
    const licence = document.getElementById("licence").value;

    const registration = document.getElementById("registration").value.toUpperCase();
    const make = document.getElementById("make").value;
    const model = document.getElementById("model").value;
    const year = document.getElementById("year").value;
    const vehicleValue = document.getElementById("value").value;

    try{
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient
        .from("quotes")
        .insert([{

            user_id:user ? user.id: null,
            reference:quoteRef,
            first_name:firstName,
            last_name:lastName,
            date_of_birth:dob,
            email:email,
            phone:phone,
            occupation:occupation,
            address:address,
            driving_licence:licence,
            registration:registration,
            make:make,
            model:model,
            year:year,
            vehicle_value:vehicleValue,
            cover_type:coverSelect.value,
            estimated_price:quotePrice,
            status:"Pending"

        }]);

        if(error){
            throw error;
        }

        message.innerHTML =
        "Quote created successfully.<br><br>" +
        "Reference: <b>" + quoteRef + "</b><br><br>" +
        "Your quote is <b>£" + quotePrice + "</b><br><br>" +
        "<button id='buyButton' type='button'>Purchase Now</button>";

    }
    catch(err){

        console.error(err);
        message.innerHTML = "Error: " + (err.message || "Unable to save quote.");

    }

});
document.addEventListener("click", async function (e) {

    if (e.target.id !== "buyButton") return;

    const button = e.target;

    button.disabled = true;
    button.innerText = "Starting payment...";

    try {

        const response = await fetch(
            "https://lvjdaizpaqjnchjvrsni.supabase.co/functions/v1/create-checkout",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    amount: document.getElementById("price").innerText.replace("£", ""),
                    email: document.getElementById("email").value,
                    quoteRef: document.querySelector("#message b").innerText
                })
            }
        );

        const data = await response.json();

        if (data.url) {
            window.location.href = data.url;
        } else {
            alert(data.error || "Unable to start payment.");
            button.disabled = false;
            button.innerText = "Purchase Now";
        }

    } catch (err) {

        console.error(err);

        alert("Payment failed.");

        button.disabled = false;
        button.innerText = "Purchase Now";

    }

});

</script>

</script>

</body>
</html>
