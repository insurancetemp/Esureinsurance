<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Get a Quote - Esureinsurance</title>

<style>

body {
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
}

header {
background:#003b73;
color:white;
text-align:center;
padding:25px;
}

.container {
max-width:700px;
margin:30px auto;
padding:20px;
}

.card {
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2 {
color:#003b73;
margin-top:25px;
}

label {
display:block;
margin-top:15px;
font-weight:bold;
}

input, select {
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

.lookup {
display:flex;
gap:10px;
}

.lookup input {
flex:1;
}

button {
width:100%;
margin-top:20px;
padding:14px;
background:#ffb000;
border:none;
border-radius:8px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.lookup button {
width:160px;
margin-top:5px;
}

.vehicle-box {
background:#eef6ff;
padding:15px;
border-radius:8px;
margin-top:20px;
}

.message {
background:#e8f5e9;
padding:12px;
border-radius:8px;
margin-top:15px;
display:none;
}

</style>

</head>


<body>

<header>

<h1>Esureinsurance</h1>

<p>Get your temporary car insurance quote</p>

</header>


<div class="container">

<div class="card">


<h2>Your Personal Details</h2>


<label>First Name</label>
<input id="firstName" placeholder="First name">


<label>Last Name</label>
<input id="lastName" placeholder="Last name">


<label>Date of Birth</label>
<input id="dob" type="date">


<label>Email Address</label>
<input id="email" type="email" placeholder="Email">


<label>Phone Number</label>
<input id="phone" placeholder="Phone number">


<label>Address</label>
<input id="address" placeholder="Home address">


<label>Occupation</label>
<input id="occupation" placeholder="Occupation">


<label>Driving Licence Number</label>
<input id="license" placeholder="Driving licence number">



<h2>Vehicle Details</h2>


<label>Registration Number</label>

<div class="lookup">

<input id="registration" placeholder="Example AB12 CDE">

<button onclick="findVehicle()">
Find Vehicle
</button>

</div>


<div id="vehicleMessage" class="message">

Vehicle details ready. Please check details.

</div>


<div id="vehicleBox" class="vehicle-box" style="display:none;">


<label>Make</label>
<input id="make">


<label>Model</label>
<input id="model">


<label>Year</label>
<input id="year">


<label>Engine Size</label>
<input id="engine">


<label>Fuel Type</label>
<input id="fuel">


</div>



<h2>Cover</h2>


<select id="cover">

<option value="1 Hour Cover">1 Hour Cover - £20</option>

<option value="1 Day Cover">1 Day Cover - £45</option>

</select>



<button onclick="getQuote()">

Get Quote

</button>



<div id="quoteResult" class="vehicle-box" style="display:none;">

<h2>Your Quote</h2>

<div id="quoteDetails"></div>

</div>



</div>

</div>



<script>


function findVehicle(){

let reg=document.getElementById("registration").value.trim();


if(reg===""){

alert("Enter registration number");

return;

}


document.getElementById("vehicleBox").style.display="block";

document.getElementById("vehicleMessage").style.display="block";

}



function getQuote(){


let first=document.getElementById("firstName").value;
let last=document.getElementById("lastName").value;
let dob=document.getElementById("dob").value;
let email=document.getElementById("email").value;
let address=document.getElementById("address").value;
let occupation=document.getElementById("occupation").value;
let license=document.getElementById("license").value;

let make=document.getElementById("make").value;
let model=document.getElementById("model").value;
let year=document.getElementById("year").value;

let cover=document.getElementById("cover").value;



if(
first==="" ||
last==="" ||
dob==="" ||
email==="" ||
address==="" ||
occupation==="" ||
license==="" ||
make==="" ||
model==="" ||
year===""
){

alert("Please complete all required fields");

return;

}



let price = cover==="1 Hour Cover" ? "£20" : "£45";



document.getElementById("quoteResult").style.display="block";


document.getElementById("quoteDetails").innerHTML=

`
Name: ${first} ${last}<br>
Date of Birth: ${dob}<br>
Occupation: ${occupation}<br>
Vehicle: ${make} ${model}<br>
Year: ${year}<br>
Cover: ${cover}<br><br>

<strong>Your Price: ${price}</strong>
`;

}


</script>


</body>

</html>
